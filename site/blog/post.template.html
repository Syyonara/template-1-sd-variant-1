<article class="post container">
  <header class="post-head">
    <p class="post-eyebrow">Blog</p>
    <h1 class="post-title">{{title}}</h1>
    <p class="post-meta"><time datetime="{{date}}">{{dateHuman}}</time></p>
    {{coverImage}}
  </header>
  <div class="post-body">
    {{body}}
  </div>
  <footer class="post-foot">
    <a class="btn btn-ghost" href="/blog">&larr; Back to all posts</a>
  </footer>
</article>
